<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Doodle Jump</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #87ceeb;
    font-family: system-ui, Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    background: linear-gradient(#aee4ff, #e8f7ff);
  }
  canvas {
    background: #f4fbff;
    border: 4px solid #333;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    display: block;
  }
  #hud {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 22px;
    font-weight: bold;
    color: #333;
    background: rgba(255,255,255,.7);
    padding: 4px 14px;
    border-radius: 999px;
    pointer-events: none;
    text-align: center;
  }
  #hud small { font-weight: normal; font-size: 13px; color: #666; display: block; }
  #over {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(0,0,0,.45);
    color: #fff;
    text-align: center;
  }
  #over h1 { font-size: 40px; }
  #over p { font-size: 22px; }
  #over button {
    font-size: 20px;
    padding: 10px 24px;
    border: none;
    border-radius: 999px;
    background: #4caf50;
    color: #fff;
    cursor: pointer;
  }
  #hint {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: #555;
    font-size: 14px;
    background: rgba(255,255,255,.6);
    padding: 4px 12px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game"></canvas></div>
  <div id="hud">0<small>Nivel 1</small></div>
  <div id="hint">Flechas / A-D o inclina el móvil</div>
  <div id="over">
    <h1>Game Over</h1>
    <p id="finalScore">Puntos: 0</p>
    <button id="retry">Jugar otra vez</button>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const over = document.getElementById('over');
  const finalScore = document.getElementById('finalScore');

  const W = 400, H = 600;
  canvas.width = W;
  canvas.height = H;

  const GRAVITY = 0.35;
  const JUMP = -13;
  const SPRING_JUMP = -22;     // muelle: rebote fuerte
  const JETPACK_FORCE = -1.1;  // jetpack: empuje por cuadro
  const JETPACK_FRAMES = 70;   // cuánto dura el jetpack
  const MOVE = 0.8;
  const MAX_VX = 7;
  const PLAT_W = 70, PLAT_H = 14;
  const SCORE_DIV = 10;        // menos puntos: 1 por cada 10 px subidos

  let player, platforms, score, scoreAcc, best = 0, running, cameraY, level;
  let keys = { left: false, right: false };
  let tiltX = 0;

  // dificultad por nivel: cada nivel sube con los puntos
  function levelFor(s) { return 1 + Math.floor(s / 500); }
  function gapFor(lvl) { return 55 + Math.min(lvl * 6, 55); }          // huecos más grandes
  function moveChance(lvl) { return Math.min(0.08 + lvl * 0.04, 0.38); } // más móviles
  function breakChance(lvl) { return Math.min(lvl * 0.03, 0.22); }      // más frágiles
  function holeChance(lvl) { return lvl >= 3 ? Math.min((lvl - 2) * 0.02, 0.12) : 0; } // agujeros desde nivel 3

  function makePlatform(y, lvl) {
    const r = Math.random();
    let type = 'fixed';
    if (r < holeChance(lvl)) type = 'hole';
    else if (r < holeChance(lvl) + breakChance(lvl)) type = 'break';
    else if (r < holeChance(lvl) + breakChance(lvl) + moveChance(lvl)) type = 'move';

    // power-up encima de algunas plataformas sólidas
    let power = null;
    if (type === 'fixed' || type === 'move') {
      const pr = Math.random();
      if (pr < 0.05) power = 'jetpack';
      else if (pr < 0.14) power = 'spring';
    }

    return {
      x: Math.random() * (W - PLAT_W),
      y,
      type,
      power,
      dir: Math.random() < 0.5 ? 1 : -1,
      vx: 1.4 + Math.min(lvl * 0.2, 2),
      dead: false   // para plataformas que se rompen
    };
  }

  function reset() {
    player = { x: W / 2 - 20, y: H - 120, w: 40, h: 40, vx: 0, vy: JUMP, face: 1, jet: 0 };
    platforms = [];
    platforms.push({ x: W / 2 - PLAT_W / 2, y: H - 70, type: 'fixed', power: null, dir: 1, vx: 0, dead: false });
    let y = H - 70;
    while (y > -H) {
      y -= gapFor(1);
      platforms.push(makePlatform(y, 1));
    }
    score = 0;
    scoreAcc = 0;
    level = 1;
    cameraY = 0;
    running = true;
    over.style.display = 'none';
  }

  function spawnAbove() {
    let topY = Math.min(...platforms.map(p => p.y));
    while (topY > cameraY - H) {
      topY -= gapFor(level) + Math.random() * 30;
      platforms.push(makePlatform(topY, level));
    }
  }

  function doJump(force) { player.vy = force; }

  function hitPower(p) {
    if (p.power === 'spring') { doJump(SPRING_JUMP); }
    else if (p.power === 'jetpack') { player.jet = JETPACK_FRAMES; }
    p.power = null; // se consume
  }

  function update() {
    if (!running) return;

    // input horizontal
    let ax = 0;
    if (keys.left) ax -= MOVE;
    if (keys.right) ax += MOVE;
    ax += tiltX * MOVE;
    player.vx += ax;
    if (!ax) player.vx *= 0.92;
    player.vx = Math.max(-MAX_VX, Math.min(MAX_VX, player.vx));
    player.x += player.vx;
    if (player.vx > 0.2) player.face = 1;
    if (player.vx < -0.2) player.face = -1;

    // wrap horizontal
    if (player.x + player.w < 0) player.x = W;
    if (player.x > W) player.x = -player.w;

    // jetpack: empuje hacia arriba mientras dure
    if (player.jet > 0) {
      player.vy += JETPACK_FORCE;
      if (player.vy < -16) player.vy = -16;
      player.jet--;
    }

    // gravedad + barrido
    const prevFoot = player.y + player.h;
    player.vy += GRAVITY;
    player.y += player.vy;
    const newFoot = player.y + player.h;

    // plataformas móviles
    for (const p of platforms) {
      if (p.type === 'move' && !p.dead) {
        p.x += p.dir * p.vx;
        if (p.x < 0 || p.x + PLAT_W > W) p.dir *= -1;
      }
    }

    // colisión al caer (barrido anti-tunnel)
    if (player.vy > 0 && player.jet <= 0) {
      for (const p of platforms) {
        if (p.dead) continue;
        const overlapX = player.x + player.w > p.x && player.x < p.x + PLAT_W;
        const crossed = prevFoot <= p.y + PLAT_H && newFoot >= p.y;
        if (!overlapX || !crossed) continue;

        if (p.type === 'hole') {
          // agujero negro: caes y mueres
          continue; // no rebota; sigue cayendo
        }
        // aterrizaje
        player.y = p.y - player.h;
        if (p.power) hitPower(p);
        else doJump(JUMP);
        if (p.type === 'break') p.dead = true; // se rompe tras pisarla
        break;
      }
    }

    // cámara estable: solo sube, nunca baja
    const screenY = player.y - cameraY;
    if (screenY < H / 2) {
      const dy = H / 2 - screenY;
      cameraY -= dy;
      scoreAcc += dy;
      const add = Math.floor(scoreAcc / SCORE_DIV);
      if (add > 0) { score += add; scoreAcc -= add * SCORE_DIV; }
    }

    // nivel / dificultad
    level = levelFor(score);

    spawnAbove();
    platforms = platforms.filter(p => p.y - cameraY < H + 60);

    // muerte: caer por debajo de la pantalla
    if (player.y - cameraY > H) gameOver();

    hud.innerHTML = score + '<small>Nivel ' + level + (player.jet > 0 ? ' · 🚀' : '') + '</small>';
  }

  function gameOver() {
    running = false;
    best = Math.max(best, score);
    finalScore.textContent = 'Puntos: ' + score + '   Mejor: ' + best + '   Nivel: ' + level;
    over.style.display = 'flex';
  }

  function drawPlatform(p) {
    const y = p.y - cameraY;
    if (y < -40 || y > H) return;

    if (p.type === 'hole') {
      // agujero negro
      const cx = p.x + PLAT_W / 2, cy = y + PLAT_H / 2;
      const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, PLAT_W / 2);
      g.addColorStop(0, '#000');
      g.addColorStop(0.7, '#2a0d3a');
      g.addColorStop(1, 'rgba(60,20,90,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(cx, cy, PLAT_W / 2, PLAT_H + 6, 0, 0, Math.PI * 2);
      ctx.fill();
      return;
    }

    let top, body;
    if (p.type === 'move') { top = '#58c3f5'; body = '#2e9bd6'; }
    else if (p.type === 'break') { top = '#e6a86b'; body = '#c77d3a'; } // frágil (marrón claro)
    else { top = '#3e8e41'; body = '#6b4f2a'; }

    ctx.fillStyle = body;
    ctx.fillRect(p.x, y, PLAT_W, PLAT_H);
    ctx.fillStyle = top;
    ctx.fillRect(p.x, y, PLAT_W, 5);

    if (p.type === 'break') {
      // grietas
      ctx.strokeStyle = 'rgba(80,40,10,.6)';
      ctx.beginPath();
      ctx.moveTo(p.x + 20, y); ctx.lineTo(p.x + 28, y + PLAT_H);
      ctx.moveTo(p.x + 45, y); ctx.lineTo(p.x + 38, y + PLAT_H);
      ctx.stroke();
    }

    // power-ups
    if (p.power === 'spring') {
      const sx = p.x + PLAT_W / 2;
      ctx.strokeStyle = '#888'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(sx - 6, y - 2);
      ctx.lineTo(sx + 6, y - 7);
      ctx.lineTo(sx - 6, y - 12);
      ctx.lineTo(sx + 6, y - 17);
      ctx.stroke();
      ctx.lineWidth = 1;
    } else if (p.power === 'jetpack') {
      const jx = p.x + PLAT_W / 2 - 6;
      ctx.fillStyle = '#d33';
      ctx.fillRect(jx, y - 20, 12, 18);
      ctx.fillStyle = '#ffb300';
      ctx.beginPath();
      ctx.moveTo(jx + 2, y - 2);
      ctx.lineTo(jx + 6, y + 6);
      ctx.lineTo(jx + 10, y - 2);
      ctx.fill();
    }
  }

  function drawPlayer() {
    const y = player.y - cameraY;
    // llama del jetpack
    if (player.jet > 0) {
      ctx.fillStyle = '#ffb300';
      ctx.beginPath();
      ctx.moveTo(player.x + 10, y + player.h);
      ctx.lineTo(player.x + player.w / 2, y + player.h + 18 + Math.random() * 8);
      ctx.lineTo(player.x + player.w - 10, y + player.h);
      ctx.fill();
    }
    ctx.fillStyle = '#5bc236';
    ctx.beginPath();
    ctx.ellipse(player.x + player.w / 2, y + player.h / 2, player.w / 2, player.h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    const ex = player.face > 0 ? 8 : -8;
    ctx.beginPath();
    ctx.arc(player.x + player.w / 2 + ex - 5, y + 14, 5, 0, Math.PI * 2);
    ctx.arc(player.x + player.w / 2 + ex + 5, y + 14, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(player.x + player.w / 2 + ex - 4, y + 15, 2, 0, Math.PI * 2);
    ctx.arc(player.x + player.w / 2 + ex + 6, y + 15, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const p of platforms) drawPlatform(p);
    drawPlayer();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // controles
  addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  });
  addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });
  addEventListener('deviceorientation', e => {
    if (e.gamma != null) tiltX = Math.max(-1, Math.min(1, e.gamma / 25));
  });
  addEventListener('touchstart', handleTouch);
  addEventListener('touchmove', handleTouch);
  addEventListener('touchend', () => { keys.left = keys.right = false; });
  function handleTouch(e) {
    const t = e.touches[0];
    if (!t) return;
    keys.left = t.clientX < innerWidth / 2;
    keys.right = t.clientX >= innerWidth / 2;
  }

  document.getElementById('retry').addEventListener('click', reset);

  reset();
  loop();
})();
</script>
</body>
</html>
