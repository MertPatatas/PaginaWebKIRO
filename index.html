<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chicken Jump</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #87ceeb;
    font-family: system-ui, Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    background: linear-gradient(#aee4ff, #e8f7ff);
  }
  canvas {
    background: #f4fbff;
    border: 4px solid #333;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    display: block;
  }
  #hud {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 22px;
    font-weight: bold;
    color: #333;
    background: rgba(255,255,255,.7);
    padding: 4px 14px;
    border-radius: 999px;
    pointer-events: none;
    text-align: center;
  }
  #hud small { font-weight: normal; font-size: 13px; color: #666; display: block; }
  #over {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(0,0,0,.45);
    color: #fff;
    text-align: center;
  }
  #over h1 { font-size: 40px; }
  #over p { font-size: 22px; }
  #over button {
    font-size: 20px;
    padding: 10px 24px;
    border: none;
    border-radius: 999px;
    background: #4caf50;
    color: #fff;
    cursor: pointer;
  }
  #hint {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: #555;
    font-size: 14px;
    background: rgba(255,255,255,.6);
    padding: 4px 12px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game"></canvas></div>
  <div id="hud">0<small>Nivel 1</small></div>
  <div id="hint">Moverse: flechas / A-D · Disparar huevo: Espacio o W (móvil: toca arriba)</div>
  <div id="over">
    <h1>Game Over</h1>
    <p id="finalScore">Puntos: 0</p>
    <button id="retry">Jugar otra vez</button>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const over = document.getElementById('over');
  const finalScore = document.getElementById('finalScore');

  const W = 400, H = 600;
  canvas.width = W;
  canvas.height = H;

  const GRAVITY = 0.35;
  const JUMP = -13;
  const TRAMPOLINE_JUMP = -17;  // trampolín: rebote medio
  const SPRING_JUMP = -22;      // muelle: rebote alto
  const BOOSTER_JUMP = -26;     // propulsor: impulso corto muy fuerte
  const JETPACK_FORCE = -1.1;   // jetpack: empuje por cuadro
  const JETPACK_FRAMES = 80;    // duración del jetpack
  const SHIELD_FRAMES = 360;    // escudo: ~6 s a 60fps
  const MOVE = 0.8;
  const MAX_VX = 7;
  const PLAT_W = 70, PLAT_H = 14;
  const SCORE_DIV = 10;

  let player, platforms, score, scoreAcc, best = 0, running, cameraY, level;
  let keys = { left: false, right: false };
  let tiltX = 0;

  // ---- dificultad por nivel ----
  function levelFor(s) { return 1 + Math.floor(s / 500); }
  function gapFor(lvl) { return 55 + Math.min(lvl * 6, 55); }
  function moveChance(lvl) { return Math.min(0.08 + lvl * 0.04, 0.38); }
  function breakChance(lvl) { return Math.min(lvl * 0.03, 0.22); }
  function holeChance(lvl) { return lvl >= 3 ? Math.min((lvl - 2) * 0.02, 0.12) : 0; }
  // obstáculos (pincho/monstruo) encima de plataformas: más con el nivel
  function hazardChance(lvl) { return lvl >= 2 ? Math.min((lvl - 1) * 0.04, 0.3) : 0; }

  // ---- rareza de ítems de impulso (probabilidad por plataforma sólida) ----
  // de más común a más raro — bajas, para que no salgan muchos a la vez
  const ITEM_RARITY = [
    { kind: 'trampoline', p: 0.030 },  // común
    { kind: 'spring',     p: 0.018 },  // frecuente
    { kind: 'shield',     p: 0.009 },  // raro
    { kind: 'booster',    p: 0.005 },  // muy raro
    { kind: 'jetpack',    p: 0.0025 }, // épico
  ];
  // nº mínimo de plataformas sin ítem tras colocar uno (evita rachas)
  const ITEM_SPACING = 5;
  let itemCooldown = 0;

  function rollItem() {
    if (itemCooldown > 0) { itemCooldown--; return null; }
    let r = Math.random();
    for (const it of ITEM_RARITY) {
      if (r < it.p) { itemCooldown = ITEM_SPACING; return it.kind; }
      r -= it.p;
    }
    return null;
  }

  function makePlatform(y, lvl) {
    const r = Math.random();
    let type = 'fixed';
    if (r < holeChance(lvl)) type = 'hole';
    else if (r < holeChance(lvl) + breakChance(lvl)) type = 'break';
    else if (r < holeChance(lvl) + breakChance(lvl) + moveChance(lvl)) type = 'move';

    let power = null;      // ítem de impulso o escudo
    let hazard = null;     // obstáculo sobre la plataforma: solo pinchos
    if (type === 'fixed' || type === 'move') {
      power = rollItem();
      if (!power && Math.random() < hazardChance(lvl)) hazard = 'spike';
    }

    return {
      x: Math.random() * (W - PLAT_W),
      y, type, power, hazard,
      spikeX: Math.random() * (PLAT_W - SPIKE_W),   // los pinchos ocupan solo un trozo
      dir: Math.random() < 0.5 ? 1 : -1,
      vx: 1.4 + Math.min(lvl * 0.25, 2.6),
      dead: false,
      mphase: Math.random() * Math.PI * 2
    };
  }

  // ---------- bichos voladores ----------
  const SPIKE_W = 24;
  let monsters = [], monsterCooldown = 0;
  function monsterChance(lvl) { return lvl >= 2 ? Math.min((lvl - 1) * 0.06, 0.4) : 0; }
  const MONSTER_R = { blob: 21, bat: 20, eye: 21, ufo: 25 };
  const MONSTER_SCALE = 1.45;   // los bichos se dibujan más grandes

  // ---------- huevos (disparo) ----------
  let eggs = [], shootCd = 0, poofs = [];
  function shoot() {
    if (!running || shootCd > 0) return;
    eggs.push({ x: player.x + player.w / 2, y: player.y + 4, vy: -11 });
    shootCd = 14;
  }
  function killFx(m, text) {
    m.dead = true;
    poofs.push({ x: m.x, y: m.y, t: 0 });
    popups.push({ text, color: '#ff9800', x: m.x, y: m.y - cameraY - 20, t: 60 });
  }

  function maybeMonster(y, lvl) {
    if (monsterCooldown > 0) { monsterCooldown--; return; }
    if (Math.random() >= monsterChance(lvl)) return;
    const z = zoneIdx(-y / SCORE_DIV);
    const kinds = z <= 1 ? ['blob', 'bat'] : z <= 3 ? ['bat', 'eye', 'blob'] : ['ufo', 'eye'];
    const kind = kinds[Math.floor(Math.random() * kinds.length)];
    const x0 = 40 + Math.random() * (W - 80);
    monsters.push({ kind, x0, y0: y, x: x0, y, r: MONSTER_R[kind],
                    t: Math.random() * 100, vx: (Math.random() < 0.5 ? -1 : 1) * (0.8 + Math.random() * 0.8) });
    monsterCooldown = 4;
  }

  function moveMonster(m) {
    m.t++;
    if (m.kind === 'blob') {
      m.x = m.x0 + Math.sin(m.t * 0.03) * 30; m.y = m.y0 + Math.sin(m.t * 0.07) * 6;
    } else if (m.kind === 'eye') {
      m.x = m.x0 + Math.cos(m.t * 0.04) * 40; m.y = m.y0 + Math.sin(m.t * 0.04) * 20;
    } else {
      const sp = m.kind === 'ufo' ? 1.5 : 1;
      m.x0 += m.vx * sp;
      if (m.x0 < 25 || m.x0 > W - 25) m.vx *= -1;
      m.x = m.x0;
      m.y = m.y0 + Math.sin(m.t * (m.kind === 'bat' ? 0.15 : 0.05)) * (m.kind === 'bat' ? 8 : 5);
    }
  }

  // ¿choca un círculo (bicho) con el pollo? (caja un poco más pequeña que el dibujo)
  function hitsPlayer(cx, cy, r) {
    const nx = Math.max(player.x + 6, Math.min(cx, player.x + player.w - 6));
    const ny = Math.max(player.y + 4, Math.min(cy, player.y + player.h));
    return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
  }

  // ¿toca el pollo los pinchos de esta plataforma? (solo la zona de pinchos)
  function hitsSpikes(p) {
    const sx = p.x + p.spikeX;
    return player.x + player.w - 8 > sx && player.x + 8 < sx + SPIKE_W &&
           player.y + player.h > p.y - 13 && player.y < p.y;
  }

  function reset() {
    player = { x: W/2 - 20, y: H - 120, w: 40, h: 40, vx: 0, vy: JUMP, face: 1, jet: 0, shield: 0 };
    platforms = [];
    platforms.push({ x: W/2 - PLAT_W/2, y: H - 70, type: 'fixed', power: null, hazard: null, dir: 1, vx: 0, dead: false });
    let y = H - 70;
    while (y > -H) { y -= gapFor(1); platforms.push(makePlatform(y, 1)); }
    score = 0; scoreAcc = 0; level = 1; cameraY = 0;
    itemCooldown = 0;
    monsters = []; monsterCooldown = 0;
    eggs = []; poofs = []; shootCd = 0;
    running = true; over.style.display = 'none';
  }

  function spawnAbove() {
    let topY = Math.min(...platforms.map(p => p.y));
    while (topY > cameraY - H) {
      const gap = gapFor(level) + Math.random() * 30;
      topY -= gap;
      platforms.push(makePlatform(topY, level));
      maybeMonster(topY + gap / 2, level);   // bicho en el aire, entre plataformas
    }
  }

  function doJump(force) { player.vy = force; }

  function takeItem(p) {
    addPopup(p.power);
    switch (p.power) {
      case 'trampoline': doJump(TRAMPOLINE_JUMP); break;
      case 'spring':     doJump(SPRING_JUMP); break;
      case 'booster':    doJump(BOOSTER_JUMP); break;
      case 'jetpack':    player.jet = JETPACK_FRAMES; break;
      case 'shield':     player.shield = SHIELD_FRAMES; doJump(JUMP); break;
    }
    p.power = null;
  }

  // ¿el jugador toca el cuerpo de esta plataforma/obstáculo ahora?
  function touching(p) {
    const y = p.y;
    return player.x + player.w > p.x && player.x < p.x + PLAT_W &&
           player.y + player.h > y - 22 && player.y < y + PLAT_H;
  }

  function update() {
    if (!running) return;

    // horizontal
    let ax = 0;
    if (keys.left) ax -= MOVE;
    if (keys.right) ax += MOVE;
    ax += tiltX * MOVE;
    player.vx += ax;
    if (!ax) player.vx *= 0.92;
    player.vx = Math.max(-MAX_VX, Math.min(MAX_VX, player.vx));
    player.x += player.vx;
    if (player.vx > 0.2) player.face = 1;
    if (player.vx < -0.2) player.face = -1;
    if (player.x + player.w < 0) player.x = W;
    if (player.x > W) player.x = -player.w;

    // jetpack
    if (player.jet > 0) {
      player.vy += JETPACK_FORCE;
      if (player.vy < -16) player.vy = -16;
      player.jet--;
    }
    // escudo cuenta atrás
    if (player.shield > 0) player.shield--;

    // gravedad + barrido
    const prevFoot = player.y + player.h;
    player.vy += GRAVITY;
    player.y += player.vy;
    const newFoot = player.y + player.h;

    // plataformas móviles + animación de rotura
    for (const p of platforms) {
      if (p.breakT > 0) p.breakT++;
      if (p.type === 'move' && !p.dead) {
        p.x += p.dir * p.vx;
        if (p.x < 0 || p.x + PLAT_W > W) p.dir *= -1;
      }
    }

    // --- obstáculos que matan ---
    // agujero negro: toda su zona
    for (const p of platforms) {
      if (p.dead || p.type !== 'hole' || !touching(p)) continue;
      if (player.shield > 0) { player.shield = 0; p.dead = true; popText('¡Salvado!', '#00e5ff'); }
      else return gameOver();
    }
    // pinchos: SOLO si tocas los pinchos; el resto de la plataforma se puede pisar
    for (const p of platforms) {
      if (p.dead || p.hazard !== 'spike' || !hitsSpikes(p)) continue;
      if (player.shield > 0) { player.shield = 0; p.hazard = null; popText('¡Salvado!', '#00e5ff'); }
      else return gameOver();
    }
    // bichos voladores
    for (const m of monsters) {
      moveMonster(m);
      if (m.dead || !hitsPlayer(m.x, m.y, m.r)) continue;
      if (player.vy > 0 && player.y + player.h < m.y) {
        // le caes encima: lo aplastas y rebotas
        killFx(m, '¡Plaf!'); doJump(JUMP);
      } else if (player.shield > 0) {
        m.dead = true; player.shield = 0; popText('¡Salvado!', '#00e5ff');
      } else {
        return gameOver();
      }
    }
    // huevos: suben y matan al bicho que tocan
    if (shootCd > 0) shootCd--;
    for (const e of eggs) {
      e.y += e.vy;
      for (const m of monsters) {
        if (!m.dead && (e.x - m.x) ** 2 + (e.y - m.y) ** 2 < (m.r + 6) ** 2) {
          killFx(m, '¡Toma!'); e.dead = true; break;
        }
      }
    }
    eggs = eggs.filter(e => !e.dead && e.y - cameraY > -30);
    for (const pf of poofs) pf.t++;
    poofs = poofs.filter(pf => pf.t < 25);
    monsters = monsters.filter(m => !m.dead && m.y - cameraY < H + 60);

    // --- aterrizaje normal (solo al caer) ---
    if (player.vy > 0 && player.jet <= 0) {
      for (const p of platforms) {
        if (p.dead || p.type === 'hole') continue;
        const overlapX = player.x + player.w > p.x && player.x < p.x + PLAT_W;
        const crossed = prevFoot <= p.y + PLAT_H && newFoot >= p.y;
        if (!overlapX || !crossed) continue;
        player.y = p.y - player.h;
        if (p.power) takeItem(p);
        else doJump(JUMP);
        if (p.type === 'break') { p.dead = true; p.breakT = 1; }
        break;
      }
    }

    // cámara estable: solo sube
    const screenY = player.y - cameraY;
    if (screenY < H / 2) {
      const dy = H / 2 - screenY;
      cameraY -= dy;
      scoreAcc += dy;
      const add = Math.floor(scoreAcc / SCORE_DIV);
      if (add > 0) { score += add; scoreAcc -= add * SCORE_DIV; }
    }

    level = levelFor(score);
    spawnAbove();
    platforms = platforms.filter(p => p.y - cameraY < H + 60);
    if (player.y - cameraY > H) return gameOver();

    const badges = (player.jet > 0 ? ' · 🚀' : '') + (player.shield > 0 ? ' · 🛡️' : '');
    hud.innerHTML = score + '<small>Nivel ' + level + ' · ' + zoneFor(score) + badges + '</small>';
  }

  function gameOver() {
    running = false;
    best = Math.max(best, score);
    finalScore.textContent = 'Puntos: ' + score + '   Mejor: ' + best + '   Nivel: ' + level;
    over.style.display = 'flex';
  }

  // ---------- terreno según la altura ----------
  // granja, montañas, cielo, estratosfera, espacio, universo
  const SKINS = [
    { body: '#6b4f2a', top: '#3e8e41', crack: 'rgba(40,20,5,.7)' },   // tierra con hierba
    { body: '#78909c', top: '#eceff1', crack: 'rgba(30,40,50,.7)' },  // roca con nieve
    { body: '#ffffff', top: '#e3f2fd', crack: 'rgba(120,140,170,.8)' }, // nube
    { body: '#4fc3f7', top: '#e1f5fe', crack: 'rgba(255,255,255,.9)' }, // hielo
    { body: '#546e7a', top: '#b0bec5', crack: 'rgba(255,80,80,.8)' },   // metal
    { body: '#311b92', top: '#e040fb', crack: 'rgba(255,255,255,.9)' }, // cristal neón
  ];
  function zoneIdx(s) { let i = 0; ZONES.forEach((z, k) => { if (s >= z.at) i = k; }); return i; }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // dibuja una plataforma de ancho w con la piel de su zona
  function drawSlab(x, y, w, type, zone) {
    const sk = SKINS[zone];
    // borde: primero el trazo y luego el relleno encima, así queda solo el contorno
    const outline = () => {
      if (zone === 2) {
        rr(x, y + 2, w, PLAT_H - 2, 7);
        for (let i = 0; i < 3; i++) {
          const ax = x + w * (0.2 + i * 0.3), r = w * 0.13;
          ctx.moveTo(ax + r, y + 3); ctx.arc(ax, y + 3, r, 0, Math.PI * 2);
        }
      } else rr(x, y, w, PLAT_H, 3);
    };
    if (zone >= 3) {   // fondos oscuros: halo claro por fuera
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 7; outline(); ctx.stroke();
    }
    if (zone === 2) {   // nube: sombra debajo + borde grueso para que destaque
      ctx.save(); ctx.translate(0, 5);
      ctx.fillStyle = 'rgba(10,20,60,.35)'; outline(); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = '#0d1b4a'; ctx.lineWidth = 6;
    } else {
      ctx.strokeStyle = '#111'; ctx.lineWidth = 4;
    }
    outline(); ctx.stroke();
    ctx.lineWidth = 1;
    if (zone === 2) {
      // nube: bultos blancos
      ctx.fillStyle = sk.body;
      rr(x, y + 2, w, PLAT_H - 2, 7); ctx.fill();
      ctx.beginPath();
      for (let i = 0; i < 3; i++) ctx.arc(x + w * (0.2 + i * 0.3), y + 3, w * 0.13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#90a4ae';
      rr(x + 3, y + PLAT_H - 5, w - 6, 4, 2); ctx.fill();
    } else if (zone === 3) {
      // hielo translúcido con brillo
      ctx.fillStyle = sk.body; ctx.globalAlpha *= 0.9;
      rr(x, y, w, PLAT_H, 3); ctx.fill();
      ctx.globalAlpha /= 0.9;
      ctx.fillStyle = sk.top; ctx.fillRect(x + 2, y + 1, w - 4, 4);
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      ctx.fillRect(x + w * 0.15, y + 6, w * 0.12, 2);
      ctx.fillRect(x + w * 0.6, y + 8, w * 0.2, 2);
    } else if (zone === 4) {
      // metal con luces
      ctx.fillStyle = sk.body; rr(x, y, w, PLAT_H, 2); ctx.fill();
      ctx.fillStyle = sk.top; ctx.fillRect(x, y, w, 4);
      ctx.fillStyle = '#37474f';
      for (let i = 1; i < 4; i++) ctx.fillRect(x + w * i / 4, y + 4, 1, PLAT_H - 4);
      const on = Math.floor(frame / 20) % 2 === 0;
      ctx.fillStyle = on ? '#76ff03' : '#33691e';
      ctx.fillRect(x + 4, y + 7, 4, 3); ctx.fillRect(x + w - 8, y + 7, 4, 3);
    } else if (zone === 5) {
      // cristal neón que cambia de color
      const hue = (frame * 2 + x) % 360;
      ctx.fillStyle = sk.body; rr(x, y, w, PLAT_H, 4); ctx.fill();
      ctx.strokeStyle = 'hsl(' + hue + ',100%,65%)'; ctx.lineWidth = 2;
      rr(x + 1, y + 1, w - 2, PLAT_H - 2, 4); ctx.stroke(); ctx.lineWidth = 1;
    } else {
      // granja (tierra + hierba) o montaña (roca + nieve)
      ctx.fillStyle = sk.body; rr(x, y, w, PLAT_H, 3); ctx.fill();
      ctx.fillStyle = sk.top; rr(x, y, w, 5, 2); ctx.fill();
      ctx.beginPath();
      for (let i = 4; i < w - 4; i += 9) {
        ctx.moveTo(x + i, y + 5); ctx.lineTo(x + i + 3, y + (zone === 0 ? 9 : 8)); ctx.lineTo(x + i + 6, y + 5);
      }
      ctx.fill();
    }

    // marcas de tipo (iguales en todas las zonas)
    if (type === 'move') {
      // flechas amarillas: se mueve
      ctx.fillStyle = '#ffd600';
      ctx.beginPath();
      ctx.moveTo(x + 2, y + PLAT_H / 2); ctx.lineTo(x + 8, y + 3); ctx.lineTo(x + 8, y + PLAT_H - 3);
      ctx.moveTo(x + w - 2, y + PLAT_H / 2); ctx.lineTo(x + w - 8, y + 3); ctx.lineTo(x + w - 8, y + PLAT_H - 3);
      ctx.fill();
    } else if (type === 'break') {
      // grietas: se rompe
      ctx.strokeStyle = sk.crack; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + w * 0.28, y); ctx.lineTo(x + w * 0.38, y + 7); ctx.lineTo(x + w * 0.32, y + PLAT_H);
      ctx.moveTo(x + w * 0.66, y); ctx.lineTo(x + w * 0.58, y + 6); ctx.lineTo(x + w * 0.64, y + PLAT_H);
      ctx.stroke(); ctx.lineWidth = 1;
    }
  }

  // ---------- dibujo ----------
  function drawPlatform(p) {
    const y = p.y - cameraY;
    if (y < -40 || y > H + 40) return;
    const zone = zoneIdx(-p.y / SCORE_DIV);   // el terreno depende de su altura

    // plataforma rota: dos mitades que caen girando + trocitos
    if (p.dead) {
      const t = p.breakT || 0;
      if (t <= 0 || t > 45) return;
      const fall = t * t * 0.12, rot = t * 0.06, half = PLAT_W / 2;
      ctx.globalAlpha = 1 - t / 45;
      for (const side of [-1, 1]) {
        const hx = p.x + (side < 0 ? 0 : half) + side * t * 0.7;
        ctx.save();
        ctx.translate(hx + half / 2, y + fall + PLAT_H / 2);
        ctx.rotate(side * rot);
        drawSlab(-half / 2, -PLAT_H / 2, half, 'break', zone);
        ctx.restore();
      }
      ctx.fillStyle = SKINS[zone].body;
      for (let i = 0; i < 5; i++) {
        const dx = p.x + 10 + i * 12 + Math.sin(i * 7) * t * 0.8;
        ctx.fillRect(dx, y + PLAT_H + fall * (1.2 + i * 0.15), 4, 4);
      }
      ctx.globalAlpha = 1;
      return;
    }

    if (p.type === 'hole') {
      const cx = p.x + PLAT_W/2, cy = y + PLAT_H/2;
      const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, PLAT_W/2);
      g.addColorStop(0, '#000'); g.addColorStop(0.7, '#2a0d3a'); g.addColorStop(1, 'rgba(60,20,90,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(cx, cy, PLAT_W/2, PLAT_H + 6, 0, 0, Math.PI*2);
      ctx.fill();
      // anillo brillante que gira: se ve en fondos claros y oscuros
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#111';
      ctx.beginPath(); ctx.ellipse(cx, cy, PLAT_W/2 - 4, PLAT_H, 0, 0, Math.PI*2); ctx.stroke();
      ctx.strokeStyle = 'hsl(' + (25 + Math.sin(frame * 0.1) * 15) + ',100%,60%)';
      ctx.setLineDash([10, 6]); ctx.lineDashOffset = -frame * 0.8;
      ctx.beginPath(); ctx.ellipse(cx, cy, PLAT_W/2 - 4, PLAT_H, 0, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]); ctx.lineWidth = 1;
      return;
    }

    drawSlab(p.x, y, PLAT_W, p.type, zone);

    // pinchos: solo en un trozo de la plataforma, con borde negro
    if (p.hazard === 'spike') {
      const sx = p.x + p.spikeX;
      ctx.fillStyle = '#eceff1';
      ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < 3; i++) {
        ctx.moveTo(sx + i * 8, y);
        ctx.lineTo(sx + i * 8 + 4, y - 13);
        ctx.lineTo(sx + i * 8 + 8, y);
      }
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#e53935';
      for (let i = 0; i < 3; i++) ctx.fillRect(sx + i * 8 + 3, y - 13, 2, 3);
      ctx.lineWidth = 1;
    }

    // ítems: cada uno con su color, halo que late y un pequeño vaivén
    if (p.power) drawItem(p.power, p.x + PLAT_W/2, y);
  }

  // ---------- ítems ----------
  const ITEM_STYLE = {
    trampoline: { glow: '#2196f3', name: '¡Trampolín!' },
    spring:     { glow: '#9e9e9e', name: '¡Muelle!' },
    shield:     { glow: '#00e5ff', name: '¡Escudo!' },
    booster:    { glow: '#ff6d00', name: '¡Cohete!' },
    jetpack:    { glow: '#ff1744', name: '¡Jetpack!' },
  };
  let frame = 0;

  function glow(x, y, r, color) {
    const pulse = 1 + Math.sin(frame * 0.12) * 0.15;
    const g = ctx.createRadialGradient(x, y, 2, x, y, r * pulse);
    g.addColorStop(0, color + 'aa');
    g.addColorStop(1, color + '00');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r * pulse, 0, Math.PI*2); ctx.fill();
  }

  function drawItem(kind, ix, py) {
    const bob = Math.sin(frame * 0.08 + ix) * 2;
    const y = py + bob;
    glow(ix, y - 12, 24, ITEM_STYLE[kind].glow);
    ctx.lineWidth = 2;
    if (kind === 'trampoline') {
      // patas + lona azul
      ctx.strokeStyle = '#37474f';
      ctx.beginPath();
      ctx.moveTo(ix - 14, y); ctx.lineTo(ix - 10, y - 8);
      ctx.moveTo(ix + 14, y); ctx.lineTo(ix + 10, y - 8);
      ctx.stroke();
      ctx.fillStyle = '#1e88e5';
      ctx.beginPath(); ctx.ellipse(ix, y - 9, 16, 4, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#90caf9';
      ctx.beginPath(); ctx.ellipse(ix, y - 10, 11, 2, 0, 0, Math.PI*2); ctx.fill();
    } else if (kind === 'spring') {
      // muelle en espiral con tapa roja
      ctx.strokeStyle = '#616161'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(ix - 7, y);
      for (let i = 1; i <= 4; i++) ctx.lineTo(ix + (i % 2 ? 7 : -7), y - i * 4);
      ctx.stroke();
      ctx.fillStyle = '#e53935';
      ctx.fillRect(ix - 9, y - 20, 18, 4);
    } else if (kind === 'shield') {
      // escudo con estrella
      ctx.fillStyle = '#00b8d4';
      ctx.strokeStyle = '#006064';
      ctx.beginPath();
      ctx.moveTo(ix, y - 26);
      ctx.lineTo(ix + 11, y - 21);
      ctx.lineTo(ix + 10, y - 10);
      ctx.quadraticCurveTo(ix + 6, y - 3, ix, y - 1);
      ctx.quadraticCurveTo(ix - 6, y - 3, ix - 10, y - 10);
      ctx.lineTo(ix - 11, y - 21);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('★', ix, y - 9);
    } else if (kind === 'booster') {
      // cohete con aletas y ventana
      ctx.fillStyle = '#eceff1';
      ctx.beginPath();
      ctx.moveTo(ix, y - 30);
      ctx.quadraticCurveTo(ix + 8, y - 20, ix + 6, y - 6);
      ctx.lineTo(ix - 6, y - 6);
      ctx.quadraticCurveTo(ix - 8, y - 20, ix, y - 30);
      ctx.fill();
      ctx.fillStyle = '#ff6d00';
      ctx.beginPath(); ctx.moveTo(ix - 6, y - 12); ctx.lineTo(ix - 11, y - 3); ctx.lineTo(ix - 6, y - 6); ctx.fill();
      ctx.beginPath(); ctx.moveTo(ix + 6, y - 12); ctx.lineTo(ix + 11, y - 3); ctx.lineTo(ix + 6, y - 6); ctx.fill();
      ctx.fillStyle = '#29b6f6';
      ctx.beginPath(); ctx.arc(ix, y - 18, 3, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffca28';
      ctx.beginPath(); ctx.moveTo(ix - 4, y - 6); ctx.lineTo(ix, y + 1); ctx.lineTo(ix + 4, y - 6); ctx.fill();
    } else if (kind === 'jetpack') {
      // dos tanques rojos con correa
      ctx.fillStyle = '#d32f2f';
      ctx.fillRect(ix - 11, y - 26, 9, 20);
      ctx.fillRect(ix + 2, y - 26, 9, 20);
      ctx.fillStyle = '#ffcdd2';
      ctx.fillRect(ix - 10, y - 25, 3, 18);
      ctx.fillRect(ix + 3, y - 25, 3, 18);
      ctx.fillStyle = '#424242';
      ctx.fillRect(ix - 11, y - 19, 22, 3);
      ctx.fillStyle = '#ffb300';
      ctx.beginPath(); ctx.moveTo(ix - 9, y - 6); ctx.lineTo(ix - 6.5, y + 1); ctx.lineTo(ix - 4, y - 6); ctx.fill();
      ctx.beginPath(); ctx.moveTo(ix + 4, y - 6); ctx.lineTo(ix + 6.5, y + 1); ctx.lineTo(ix + 9, y - 6); ctx.fill();
    }
    ctx.lineWidth = 1;
  }

  // texto que flota al coger un ítem
  let popups = [];
  function addPopup(kind) { popText(ITEM_STYLE[kind].name, ITEM_STYLE[kind].glow); }
  function popText(text, color) {
    popups.push({ text, color, x: player.x + player.w/2, y: player.y - cameraY - 10, t: 60 });
  }
  function drawPopups() {
    ctx.textAlign = 'center';
    ctx.font = 'bold 20px system-ui';
    for (const p of popups) {
      ctx.globalAlpha = p.t / 60;
      ctx.lineWidth = 4; ctx.strokeStyle = '#fff';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
      p.y -= 0.8; p.t--;
    }
    ctx.globalAlpha = 1; ctx.lineWidth = 1;
    popups = popups.filter(p => p.t > 0);
  }

  // ---------- fondo: granja → montañas → cielo → estratosfera → espacio → universo ----------
  const ZONES = [
    { at: 0,    name: 'Granja' },
    { at: 250,  name: 'Montañas' },
    { at: 900,  name: 'Cielo' },
    { at: 2500, name: 'Estratosfera' },
    { at: 4000, name: 'Espacio' },
    { at: 6500, name: 'Universo' },
  ];
  function zoneFor(s) { let n = ZONES[0].name; for (const z of ZONES) if (s >= z.at) n = z.name; return n; }

  const SKY = [
    { at: 0,    top: [110, 190, 250], bot: [205, 238, 255] },
    { at: 250,  top: [90, 175, 245],  bot: [180, 225, 255] },
    { at: 900,  top: [55, 125, 230],  bot: [150, 200, 250] },
    { at: 2500, top: [18, 35, 105],   bot: [70, 105, 185] },
    { at: 4000, top: [2, 3, 18],      bot: [8, 12, 40] },
    { at: 6500, top: [14, 0, 32],     bot: [48, 6, 72] },
  ];
  function skyNow(s) {
    let i = 0;
    while (i < SKY.length - 1 && s >= SKY[i + 1].at) i++;
    const a = SKY[i], b = SKY[Math.min(i + 1, SKY.length - 1)];
    const t = a === b ? 0 : Math.min(1, (s - a.at) / (b.at - a.at));
    const mix = (u, v) => u.map((c, k) => Math.round(c + (v[k] - c) * t));
    return [mix(a.top, b.top), mix(a.bot, b.bot)];
  }
  // opacidad: sube de a→b, llena hasta c, baja hasta d
  function band(s, a, b, c, d) {
    if (s <= a || s >= d) return 0;
    if (s < b) return (s - a) / (b - a);
    if (s <= c) return 1;
    return 1 - (s - c) / (d - c);
  }
  // objeto que "pasa" de arriba (start) a abajo (end) mientras subes
  function passY(s, start, end) { return -100 + (s - start) / (end - start) * (H + 200); }
  // posición que se repite en vertical con parallax
  function wrapY(y, f, span) { return ((y - cameraY * f) % span + span) % span - (span - H) / 2; }

  const STARS = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + 0.4 }));
  const CLOUDS = Array.from({ length: 8 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: 0.7 + Math.random() * 0.9 }));
  const BIRDS = Array.from({ length: 5 }, () => ({ x: Math.random() * W, y: 60 + Math.random() * 220, v: 0.4 + Math.random() * 0.6 }));
  const NEBULAE = Array.from({ length: 3 }, (_, i) => ({ x: 60 + i * 140, y: Math.random() * H, r: 120 + Math.random() * 60, hue: [280, 200, 330][i] }));
  const GALAXIES = Array.from({ length: 5 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: 16 + Math.random() * 24, a: Math.random() * Math.PI, hue: Math.floor(Math.random() * 360) }));

  function drawFarm() {
    const g = H - 30 - cameraY * 0.15;   // suelo: baja despacio al subir
    if (g - 230 > H) return;
    // colinas
    ctx.fillStyle = '#7cc56b';
    ctx.beginPath(); ctx.ellipse(90, g + 10, 170, 75, 0, Math.PI, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6ab35a';
    ctx.beginPath(); ctx.ellipse(330, g + 10, 190, 60, 0, Math.PI, Math.PI * 2); ctx.fill();
    // granero
    const bx = 25, bw = 90, bh = 70;
    ctx.fillStyle = '#c62828'; ctx.fillRect(bx, g - bh, bw, bh);
    ctx.fillStyle = '#8e1b1b';
    ctx.beginPath(); ctx.moveTo(bx - 8, g - bh); ctx.lineTo(bx + bw / 2, g - bh - 40); ctx.lineTo(bx + bw + 8, g - bh); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(bx + 30, g - 40, 30, 40);
    ctx.strokeStyle = '#c62828'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(bx + 30, g - 40); ctx.lineTo(bx + 60, g);
    ctx.moveTo(bx + 60, g - 40); ctx.lineTo(bx + 30, g);
    ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillRect(bx + 38, g - bh - 22, 14, 12);
    // silo
    ctx.fillStyle = '#b0bec5'; ctx.fillRect(bx + bw + 6, g - 100, 30, 100);
    ctx.fillStyle = '#90a4ae'; ctx.beginPath(); ctx.arc(bx + bw + 21, g - 100, 15, Math.PI, Math.PI * 2); ctx.fill();
    // árbol
    ctx.fillStyle = '#6d4c41'; ctx.fillRect(322, g - 50, 12, 50);
    ctx.fillStyle = '#2e7d32';
    ctx.beginPath();
    ctx.arc(328, g - 64, 24, 0, Math.PI * 2);
    ctx.arc(310, g - 50, 16, 0, Math.PI * 2);
    ctx.arc(346, g - 50, 16, 0, Math.PI * 2);
    ctx.fill();
    // valla
    ctx.fillStyle = '#fff8e1';
    for (let x = 170; x < 300; x += 18) ctx.fillRect(x, g - 26, 5, 26);
    ctx.fillRect(165, g - 22, 135, 4); ctx.fillRect(165, g - 12, 135, 4);
    // suelo
    ctx.fillStyle = '#5aa845'; ctx.fillRect(0, g, W, H);
    ctx.fillStyle = '#8d6e63'; ctx.fillRect(0, g + 18, W, H);
    ctx.lineWidth = 1;
  }

  function drawMountains() {
    const base = H + 20 - cameraY * 0.05;
    if (base - 330 > H) return;
    const peaks = [[-40, 220], [70, 310], [190, 240], [300, 330], [430, 230]];
    ctx.fillStyle = '#8a9bb0';
    ctx.beginPath(); ctx.moveTo(-60, base);
    for (const [x, h] of peaks) { ctx.lineTo(x, base - h); ctx.lineTo(x + 60, base - h * 0.55); }
    ctx.lineTo(W + 60, base); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    for (const [x, h] of peaks) {
      ctx.beginPath(); ctx.moveTo(x, base - h); ctx.lineTo(x - 16, base - h + 28); ctx.lineTo(x + 14, base - h + 24); ctx.closePath(); ctx.fill();
    }
  }

  function drawBalloon(x, y) {
    ctx.fillStyle = '#e53935';
    ctx.beginPath(); ctx.ellipse(x, y, 26, 32, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fdd835';
    ctx.beginPath(); ctx.ellipse(x, y, 10, 32, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#5d4037';
    ctx.beginPath(); ctx.moveTo(x - 18, y + 22); ctx.lineTo(x - 7, y + 44); ctx.moveTo(x + 18, y + 22); ctx.lineTo(x + 7, y + 44); ctx.stroke();
    ctx.fillStyle = '#8d6e63'; ctx.fillRect(x - 8, y + 44, 16, 11);
  }

  function drawPlane(x, y) {
    ctx.fillStyle = '#eceff1';
    ctx.beginPath(); ctx.ellipse(x, y, 34, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b0bec5';
    ctx.beginPath(); ctx.moveTo(x - 4, y); ctx.lineTo(x + 12, y + 20); ctx.lineTo(x + 18, y); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 24, y); ctx.lineTo(x + 34, y - 16); ctx.lineTo(x + 36, y); ctx.fill();
    ctx.fillStyle = '#29b6f6';
    for (let i = 0; i < 4; i++) ctx.fillRect(x - 22 + i * 8, y - 3, 4, 3);
  }

  function drawSatellite(x, y) {
    ctx.fillStyle = '#1565c0';
    ctx.fillRect(x - 30, y - 6, 20, 12); ctx.fillRect(x + 10, y - 6, 20, 12);
    ctx.fillStyle = '#cfd8dc'; ctx.fillRect(x - 10, y - 9, 20, 18);
    ctx.strokeStyle = '#cfd8dc';
    ctx.beginPath(); ctx.moveTo(x, y - 9); ctx.lineTo(x, y - 18); ctx.stroke();
  }

  function drawEarth(top) {
    const R = 700, cx = W / 2, cy = top + R;
    ctx.fillStyle = 'rgba(120,190,255,.35)';
    ctx.beginPath(); ctx.arc(cx, cy, R + 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1e64c8';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#43a047';
    ctx.beginPath(); ctx.ellipse(100, top + 40, 60, 18, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(290, top + 60, 80, 22, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath(); ctx.ellipse(200, top + 30, 50, 8, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawMoon(x, y) {
    ctx.fillStyle = '#e0e0e0';
    ctx.beginPath(); ctx.arc(x, y, 34, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#bdbdbd';
    ctx.beginPath(); ctx.arc(x - 10, y - 8, 7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 12, y + 6, 9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x - 4, y + 16, 5, 0, Math.PI * 2); ctx.fill();
  }

  function drawSaturn(x, y) {
    ctx.strokeStyle = '#d7b98a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(x, y, 46, 12, -0.3, Math.PI, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#e8c27a';
    ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(160,110,50,.4)';
    ctx.fillRect(x - 24, y - 6, 48, 5);
    ctx.beginPath(); ctx.ellipse(x, y, 46, 12, -0.3, 0, Math.PI); ctx.stroke();
    ctx.lineWidth = 1;
  }

  function drawBackground() {
    const s = score;
    const [top, bot] = skyNow(s);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgb(' + top + ')');
    g.addColorStop(1, 'rgb(' + bot + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // estrellas
    const sa = band(s, 2200, 4000, 1e12, 1e13);
    if (sa > 0) {
      ctx.fillStyle = '#fff';
      for (const st of STARS) {
        ctx.globalAlpha = sa * (0.6 + 0.4 * Math.sin(frame * 0.05 + st.x));
        ctx.beginPath(); ctx.arc(st.x, wrapY(st.y, 0.03, H), st.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // universo: nebulosas y galaxias
    const ua = band(s, 6000, 7000, 1e12, 1e13);
    if (ua > 0) {
      for (const n of NEBULAE) {
        const ny = wrapY(n.y, 0.02, H + 300);
        const ng = ctx.createRadialGradient(n.x, ny, 5, n.x, ny, n.r);
        ng.addColorStop(0, 'hsla(' + n.hue + ',90%,65%,' + (0.45 * ua) + ')');
        ng.addColorStop(1, 'hsla(' + n.hue + ',90%,40%,0)');
        ctx.fillStyle = ng;
        ctx.beginPath(); ctx.arc(n.x, ny, n.r, 0, Math.PI * 2); ctx.fill();
      }
      for (const ga of GALAXIES) {
        const gy = wrapY(ga.y, 0.04, H + 100);
        ctx.save();
        ctx.translate(ga.x, gy);
        ctx.rotate(ga.a + frame * 0.002);
        ctx.globalAlpha = ua;
        const gg = ctx.createRadialGradient(0, 0, 1, 0, 0, ga.r);
        gg.addColorStop(0, '#fff');
        gg.addColorStop(0.3, 'hsla(' + ga.hue + ',80%,70%,.8)');
        gg.addColorStop(1, 'hsla(' + ga.hue + ',80%,50%,0)');
        ctx.fillStyle = gg;
        ctx.beginPath(); ctx.ellipse(0, 0, ga.r, ga.r * 0.35, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    // sol (de día)
    const suna = band(s, -1, 0, 1800, 2700);
    if (suna > 0) {
      ctx.globalAlpha = suna;
      ctx.fillStyle = 'rgba(255,235,59,.35)';
      ctx.beginPath(); ctx.arc(330, 80, 46, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffeb3b';
      ctx.beginPath(); ctx.arc(330, 80, 32, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // espacio: Tierra abajo, satélite, Luna, Saturno
    const ea = band(s, 3600, 4100, 4900, 5600);
    if (ea > 0) {
      ctx.globalAlpha = ea;
      drawEarth(H - 160 + Math.max(0, s - 4100) / 1500 * 340);
      ctx.globalAlpha = 1;
    }
    if (s > 3700 && s < 4900) drawSatellite((frame * 0.6) % (W + 80) - 40, passY(s, 3700, 4900));
    if (s > 4200 && s < 6200) drawMoon(300, passY(s, 4200, 6200));
    if (s > 5200 && s < 7200) drawSaturn(100, passY(s, 5200, 7200));

    // paisajes de abajo
    drawMountains();

    // nubes
    const ca = Math.max(0.6 * band(s, -1, 0, 0, 700), band(s, 200, 700, 2200, 3000));
    if (ca > 0) {
      ctx.globalAlpha = ca * 0.35;   // nubes de fondo suaves: no se confunden con plataformas
      ctx.fillStyle = '#e3f2fd';
      for (const c of CLOUDS) {
        const cy = wrapY(c.y, 0.3, H + 80);
        const r = 18 * c.s;
        ctx.beginPath();
        ctx.arc(c.x, cy, r, 0, Math.PI * 2);
        ctx.arc(c.x + r, cy - r * 0.4, r * 1.1, 0, Math.PI * 2);
        ctx.arc(c.x + r * 2, cy, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    drawFarm();

    // pájaros (granja y montañas)
    const ba = band(s, -1, 0, 700, 1100);
    if (ba > 0) {
      ctx.globalAlpha = ba;
      ctx.strokeStyle = '#37474f'; ctx.lineWidth = 2;
      for (const b of BIRDS) {
        const bx = (b.x + frame * b.v) % (W + 40) - 20;
        const w = Math.sin(frame * 0.2 + b.x) * 3;
        ctx.beginPath();
        ctx.moveTo(bx - 7, b.y - w); ctx.lineTo(bx, b.y); ctx.lineTo(bx + 7, b.y - w);
        ctx.stroke();
      }
      ctx.globalAlpha = 1; ctx.lineWidth = 1;
    }

    // globo y avión (cielo)
    if (s > 800 && s < 2000) drawBalloon(280 + Math.sin(frame * 0.01) * 20, passY(s, 800, 2000));
    if (s > 1500 && s < 2700) drawPlane(W + 60 - (frame * 1.2) % (W + 140), passY(s, 1500, 2700));
  }

  // ---------- dibujo de bichos ----------
  function shade(x, y, r, c1, c2) {
    const g = ctx.createRadialGradient(x, y, 1, x, y, r);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    return g;
  }
  // ojo con pupila que mira al pollo
  function eyeball(ex, ey, r, m, iris) {
    const sx = m.x + ex * MONSTER_SCALE, sy = m.y + ey * MONSTER_SCALE;
    const a = Math.atan2(player.y + player.h / 2 - sy, player.x + player.w / 2 - sx);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    const px = ex + Math.cos(a) * r * 0.4, py = ey + Math.sin(a) * r * 0.4;
    if (iris) { ctx.fillStyle = iris; ctx.beginPath(); ctx.arc(px, py, r * 0.62, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(px, py, r * 0.36, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px - r * 0.15, py - r * 0.2, r * 0.13, 0, Math.PI * 2); ctx.fill();
  }

  function drawMonster(m) {
    const x = m.x, y = m.y - cameraY;
    if (y < -60 || y > H + 60) return;
    // halo rojo de peligro: se ve en cualquier fondo
    ctx.fillStyle = shade(x, y, m.r + 18, 'rgba(255,40,40,.45)', 'rgba(255,40,40,0)');
    ctx.beginPath(); ctx.arc(x, y, m.r + 18, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(MONSTER_SCALE, MONSTER_SCALE);
    ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.lineJoin = 'round';

    if (m.kind === 'blob') {
      // BABOSA: gelatina verde que se aplasta, ojos grandes, boca con dientes, baba
      const sq = 1 + Math.sin(m.t * 0.12) * 0.07;
      ctx.save(); ctx.scale(1 / sq, sq);
      ctx.fillStyle = shade(-5, -8, 22, '#ccff90', '#33691e');
      ctx.beginPath();
      ctx.moveTo(-15, 10);
      ctx.bezierCurveTo(-19, -6, -10, -17, 0, -17);
      ctx.bezierCurveTo(10, -17, 19, -6, 15, 10);
      ctx.quadraticCurveTo(11, 14, 7.5, 10);
      ctx.quadraticCurveTo(4, 14, 0, 10);
      ctx.quadraticCurveTo(-4, 14, -7.5, 10);
      ctx.quadraticCurveTo(-11, 14, -15, 10);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.ellipse(-8, -10, 4, 2.5, -0.6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      eyeball(-6, -5, 4.5, m, '#c62828');
      eyeball(6, -5, 4.5, m, '#c62828');
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(-11, -12); ctx.lineTo(-2, -9); ctx.moveTo(11, -12); ctx.lineTo(2, -9); ctx.stroke();
      ctx.lineWidth = 1.5;
      ctx.fillStyle = '#3e0d0d';
      ctx.beginPath(); ctx.moveTo(-8, 2); ctx.quadraticCurveTo(0, 10, 8, 2); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(-6, 2.5); ctx.lineTo(-4.5, 5.5); ctx.lineTo(-3, 3); ctx.moveTo(3, 3); ctx.lineTo(4.5, 5.5); ctx.lineTo(6, 2.5); ctx.fill();
      ctx.fillStyle = 'rgba(178,255,89,.8)';
      ctx.beginPath(); ctx.ellipse(5, 9 + (m.t % 40) * 0.12, 1.3, 2.2, 0, 0, Math.PI * 2); ctx.fill();
    } else if (m.kind === 'bat') {
      // MURCIÉLAGO: alas con huesos que aletean, ojos amarillos, colmillos
      const flap = Math.sin(m.t * 0.35);
      for (const s of [-1, 1]) {
        ctx.save();
        ctx.scale(s, 1);
        ctx.rotate(-flap * 0.45);
        ctx.fillStyle = shade(14, -4, 18, '#7e57c2', '#311b92');
        ctx.beginPath();
        ctx.moveTo(6, -4);
        ctx.lineTo(16, -14); ctx.lineTo(28, -8);
        ctx.quadraticCurveTo(25, -2, 27, 4);
        ctx.quadraticCurveTo(21, 1, 19, 6);
        ctx.quadraticCurveTo(14, 2, 11, 7);
        ctx.quadraticCurveTo(9, 2, 6, 4);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = 'rgba(20,0,40,.7)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(16, -14); ctx.lineTo(27, 4); ctx.moveTo(16, -14); ctx.lineTo(19, 6); ctx.moveTo(16, -14); ctx.lineTo(11, 7); ctx.stroke();
        ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
        ctx.restore();
      }
      ctx.fillStyle = shade(-3, -4, 14, '#9575cd', '#311b92');
      ctx.beginPath();
      ctx.moveTo(-9, -6); ctx.lineTo(-8, -17); ctx.lineTo(-3, -10);
      ctx.lineTo(3, -10); ctx.lineTo(8, -17); ctx.lineTo(9, -6);
      ctx.quadraticCurveTo(11, 8, 0, 11);
      ctx.quadraticCurveTo(-11, 8, -9, -6);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffd600';
      ctx.beginPath(); ctx.ellipse(-4, -3, 3.2, 3.8, 0, 0, Math.PI * 2); ctx.ellipse(4, -3, 3.2, 3.8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#111';
      ctx.fillRect(-4.6, -6, 1.2, 6); ctx.fillRect(3.4, -6, 1.2, 6);
      ctx.fillStyle = '#fff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-3.5, 4); ctx.lineTo(-2, 9); ctx.lineTo(-0.5, 4); ctx.moveTo(0.5, 4); ctx.lineTo(2, 9); ctx.lineTo(3.5, 4); ctx.fill(); ctx.stroke();
    } else if (m.kind === 'eye') {
      // OJO VOLADOR: tentáculos con ventosas, venas, iris y párpado que parpadea
      ctx.lineCap = 'round';
      for (let i = 0; i < 4; i++) {
        const bx = -9 + i * 6, w = Math.sin(m.t * 0.12 + i * 1.3) * 5;
        ctx.strokeStyle = '#111'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(bx, 10); ctx.quadraticCurveTo(bx + w, 18, bx - w * 0.6, 26); ctx.stroke();
        ctx.strokeStyle = '#8e24aa'; ctx.lineWidth = 3.5;
        ctx.beginPath(); ctx.moveTo(bx, 10); ctx.quadraticCurveTo(bx + w, 18, bx - w * 0.6, 26); ctx.stroke();
      }
      ctx.lineCap = 'butt'; ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
      ctx.fillStyle = shade(-5, -6, 18, '#ffffff', '#f48fb1');
      ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#e53935'; ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(-14, -3); ctx.quadraticCurveTo(-10, -1, -8, -4);
      ctx.moveTo(13, 5); ctx.quadraticCurveTo(10, 3, 9, 6);
      ctx.moveTo(-6, 13); ctx.quadraticCurveTo(-5, 9, -2, 10);
      ctx.stroke();
      ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5;
      const sx = m.x, sy = m.y;
      const a = Math.atan2(player.y + player.h / 2 - sy, player.x + player.w / 2 - sx);
      const ix = Math.cos(a) * 5, iy = Math.sin(a) * 5;
      ctx.fillStyle = shade(ix - 2, iy - 2, 8, '#ffcc80', '#e65100');
      ctx.beginPath(); ctx.arc(ix, iy, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.ellipse(ix, iy, 2, 4.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ix - 2.5, iy - 3, 1.5, 0, Math.PI * 2); ctx.fill();
      // párpado (parpadea de vez en cuando)
      const blink = (m.t % 160) < 8;
      ctx.fillStyle = '#6a1b9a'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 15.5, Math.PI, Math.PI * 2);
      ctx.quadraticCurveTo(0, blink ? 16 : -6, -15.5, 0);
      ctx.fill(); ctx.stroke();
    } else if (m.kind === 'ufo') {
      // OVNI: rayo, cúpula de cristal con alien, platillo metálico con luces
      const beam = 0.15 + Math.sin(m.t * 0.1) * 0.08;
      ctx.fillStyle = 'rgba(255,241,118,' + beam + ')';
      ctx.beginPath(); ctx.moveTo(-8, 5); ctx.lineTo(8, 5); ctx.lineTo(16, 34); ctx.lineTo(-16, 34); ctx.closePath(); ctx.fill();
      ctx.fillStyle = shade(0, -6, 6, '#b9f6ca', '#2e7d32');
      ctx.beginPath(); ctx.ellipse(0, -7, 5.5, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.ellipse(-2.3, -7.5, 1.7, 2.8, -0.4, 0, Math.PI * 2); ctx.ellipse(2.3, -7.5, 1.7, 2.8, 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#2e7d32'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-2, -12.5); ctx.lineTo(-4, -16); ctx.moveTo(2, -12.5); ctx.lineTo(4, -16); ctx.stroke();
      ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
      ctx.fillStyle = 'rgba(128,222,234,.45)';
      ctx.beginPath(); ctx.arc(0, -3, 12, Math.PI, Math.PI * 2); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      ctx.beginPath(); ctx.ellipse(-6, -9, 2, 4, -0.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = shade(-6, -4, 26, '#fafafa', '#455a64');
      ctx.beginPath(); ctx.ellipse(0, 0, 22, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#37474f';
      ctx.beginPath(); ctx.ellipse(0, 4, 10, 3, 0, 0, Math.PI); ctx.fill(); ctx.stroke();
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = (Math.floor(m.t / 8) + i) % 2 ? '#ffea00' : '#ff3d00';
        ctx.beginPath(); ctx.arc(-14 + i * 7, 1, 1.8, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
    ctx.lineWidth = 1;
  }

  function drawEggs() {
    for (const e of eggs) {
      const y = e.y - cameraY;
      ctx.fillStyle = '#fffde7'; ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(e.x, y, 5, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath(); ctx.ellipse(e.x - 1.5, y - 3, 1.2, 2, 0, 0, Math.PI * 2); ctx.fill();
    }
    // nube de humo al morir un bicho
    for (const pf of poofs) {
      const y = pf.y - cameraY, k = pf.t / 25;
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = '#eeeeee'; ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3;
        ctx.beginPath(); ctx.arc(pf.x + Math.cos(a) * 26 * k, y + Math.sin(a) * 26 * k, 9 * (1 - k * 0.5), 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      }
      ctx.fillStyle = '#ffd600';
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3 + 0.5;
        ctx.beginPath(); ctx.arc(pf.x + Math.cos(a) * 38 * k, y + Math.sin(a) * 38 * k, 2.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    ctx.lineWidth = 1;
  }

  // ---------- pollo ----------
  function drawPlayer() {
    const y = player.y - cameraY;
    const cx = player.x + player.w/2, cy = y + player.h/2;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(player.face, 1);   // mira hacia donde va

    // llama del jetpack + mochila
    if (player.jet > 0) {
      ctx.fillStyle = '#ffb300';
      ctx.beginPath();
      ctx.moveTo(-16, 12); ctx.lineTo(-12, 30 + Math.random() * 10); ctx.lineTo(-8, 12);
      ctx.fill();
      ctx.fillStyle = '#d32f2f';
      ctx.fillRect(-19, -6, 10, 18);
    }

    // patas
    ctx.strokeStyle = '#f57c00'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-5, 14); ctx.lineTo(-6, 21); ctx.lineTo(-10, 22);
    ctx.moveTo(5, 14); ctx.lineTo(4, 21); ctx.lineTo(0, 22);
    ctx.stroke();

    // cuerpo
    ctx.fillStyle = '#fffdf5';
    ctx.strokeStyle = '#d7ccc8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 3, 17, 15, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();

    // cola
    ctx.beginPath();
    ctx.moveTo(-15, -2); ctx.lineTo(-22, -9); ctx.lineTo(-19, 0); ctx.lineTo(-23, 2); ctx.lineTo(-15, 6);
    ctx.fill(); ctx.stroke();

    // ala: aletea al subir
    const flap = player.vy < 0 ? Math.sin(frame * 0.6) * 0.6 : 0.3;
    ctx.save();
    ctx.translate(-3, 4);
    ctx.rotate(-flap);
    ctx.fillStyle = '#f5f0e6';
    ctx.beginPath(); ctx.ellipse(-4, 0, 9, 6, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.restore();

    // cresta
    ctx.fillStyle = '#e53935';
    ctx.beginPath();
    ctx.arc(2, -13, 4, 0, Math.PI*2);
    ctx.arc(7, -12, 3.5, 0, Math.PI*2);
    ctx.arc(-3, -12, 3.5, 0, Math.PI*2);
    ctx.fill();

    // pico
    ctx.fillStyle = '#ffa000';
    ctx.beginPath(); ctx.moveTo(15, -3); ctx.lineTo(23, 0); ctx.lineTo(15, 3); ctx.fill();
    // moco rojo
    ctx.fillStyle = '#e53935';
    ctx.beginPath(); ctx.ellipse(15, 5, 2.5, 4, 0, 0, Math.PI*2); ctx.fill();

    // ojo
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(9, -4, 4.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#212121';
    ctx.beginPath(); ctx.arc(10.5, -4, 2.2, 0, Math.PI*2); ctx.fill();

    ctx.restore();
    ctx.lineWidth = 1;

    // burbuja de escudo
    if (player.shield > 0) {
      const blink = player.shield < 90 && (player.shield >> 3) % 2 === 0;
      if (!blink) {
        ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(cx, cy, 30, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = 'rgba(0,229,255,.15)'; ctx.fill(); ctx.lineWidth = 1;
      }
    }
  }

  function draw() {
    frame++;
    drawBackground();
    for (const p of platforms) drawPlatform(p);
    for (const m of monsters) drawMonster(m);
    drawEggs();
    drawPlayer();
    drawPopups();
  }

  function loop() { update(); draw(); requestAnimationFrame(loop); }

  // controles
  addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') { e.preventDefault(); shoot(); }
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  });
  addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });
  addEventListener('deviceorientation', e => {
    if (e.gamma != null) tiltX = Math.max(-1, Math.min(1, e.gamma / 25));
  });
  addEventListener('touchstart', handleTouch);
  addEventListener('touchmove', handleTouch);
  addEventListener('touchend', () => { keys.left = keys.right = false; });
  function handleTouch(e) {
    keys.left = keys.right = false;
    for (const t of e.touches) {
      if (t.clientY < innerHeight * 0.35) {           // arriba: disparar
        if (e.type === 'touchstart') shoot();
      } else {                                         // abajo: moverse
        if (t.clientX < innerWidth / 2) keys.left = true; else keys.right = true;
      }
    }
  }

  document.getElementById('retry').addEventListener('click', reset);
  reset();
  loop();
})();
</script>
</body>
</html>
